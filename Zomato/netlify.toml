[build]
base = "client"
command = "npm run build"
publish = "dist"

[build.environment]
VITE_API_BASE_URL = "https://zomato-csvi.onrender.com/api/v1"

[[redirects]]
from = "/api/v1/*"
to = "https://zomato-csvi.onrender.com/api/v1/:splat"
status = 200
force = true

[[redirects]]
from = "/api/*"
to = "https://zomato-csvi.onrender.com/api/:splat"
status = 200
force = true

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
